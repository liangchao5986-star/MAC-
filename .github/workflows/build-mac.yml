name: Build Mac App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Tkinter
        run: |
          brew install python-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install py2app pandas numpy matplotlib openpyxl python-docx

      - name: Verify files
        run: |
          ls -la
          echo "Checking main file..."
          if [ ! -f "部门业务机会分析.py" ]; then
            echo "ERROR: 部门业务机会分析.py not found!"
            exit 1
          fi
          echo "Checking setup.py..."
          if [ ! -f "setup.py" ]; then
            echo "ERROR: setup.py not found!"
            exit 1
          fi

      - name: Build App
        run: |
          python setup.py py2app

      - name: Zip App
        run: |
          cd dist
          zip -r "部门业务机会分析.app.zip" "部门业务机会分析.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: dist/部门业务机会分析.app.zip