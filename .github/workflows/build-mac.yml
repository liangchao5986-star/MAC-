name: Build Mac App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest   # 最新版Mac，排队最短
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies (tkinter)
        run: |
          brew install python-tk

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install py2app pandas numpy matplotlib openpyxl python-docx

      - name: Build App
        run: |
          python setup.py py2app --strip --no-strip-executables

      - name: Zip App
        run: |
          cd dist
          zip -r -9 "部门业务机会分析.app.zip" "部门业务机会分析.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: dist/部门业务机会分析.app.zip